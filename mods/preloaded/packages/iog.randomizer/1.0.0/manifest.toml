format_version = 1
id = "iog.randomizer"
version = "1.0.0"
name = "Randomizer"
author = "mr0ta (seed support); Illusion of Gaia Randomizer (IoGR) by DontBaguMe and contributors"
description = "Play a seed of the Illusion of Gaia Randomizer (IoGR, https://www.iogr.app): items, abilities and more shuffled, with an open world and its own win conditions. Generate a randomized ROM from your US ROM (on the website, or with tools/randomizer/generate.sh) and choose it below. Languages, MSU-1, item stacking and New Game Plus are off while a seed is loaded."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "separate"

[[target]]
game_id = "illusionofgaiausa-usa"
rom_sha256 = "32adc048fd89228a4310c03df243e83de7d436cdb2460b4cc83ade20d359b2bd"

[[feature]]
id = "randomizer"
name = "Randomizer seed"
description = "Play the randomized ROM chosen below instead of the original game."
group = "Game modes"
default_enabled = false

[[resource]]
feature = "randomizer"
id = "seed"
label = "Randomized ROM (.sfc)"
description = "A ROM generated by the Illusion of Gaia Randomizer from your own US ROM."
file_patterns = "*.sfc,*.smc"
file_description = "Randomized SNES ROM"
required = true

[[plugin]]
feature = "randomizer"
id = "iog.randomizer"
