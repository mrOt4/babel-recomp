# Forced by runtime: $80:8036 calls $82:81BC with M1X0 (X was cleared
# by REP before the JSL). Analysis assumed M1X1, dispatch missed, interp stuck.
entry_mx_at 81BC 1 0

# Force M1X0 variant: runtime reaches $02:909B (via $82 mirror) with X=0
# after the REP. Analysis only emitted M1X1, dispatch missed, interpreter
# wedged in the $BBAA handshake loop.
entry_mx_at 909B 1 0

# Force M1X0 variant: NMI handler at $82:AFC7 runs with M1X0 but analysis
# emitted M0X0. Result: 16-bit writes split into 8-bit, corrupting $4304
# (A Bus Bank) and preventing the DMA upload from ever firing MDMAEN.
# Discovered 2026-09-24 via [DMA_BANK] instrumentation.
entry_mx_at AFC7 0 0

